name: sentinelflow

x-backend-env: &backend-env
  SF_ENV: ${SF_ENV:-development}
  SF_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sentinelflow
  SF_REDIS_URL: redis://redis:6379/0
  SF_FIELD_ENCRYPTION_KEY: ${SF_FIELD_ENCRYPTION_KEY:-}
  SF_COOKIE_SECURE: ${SF_COOKIE_SECURE:-false}
  SF_CORS_ORIGINS: '["http://localhost:8080"]'
  SF_RATE_LIMIT_PER_MINUTE: ${SF_RATE_LIMIT_PER_MINUTE:-600}
  SF_LLM_API_KEY: ${SF_LLM_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelflow
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelflow"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # Not published: the API is reachable only through nginx on the internal network, which is
    # what makes trusting X-Forwarded-For (uvicorn --forwarded-allow-ips) safe.
    expose: ["8000"]

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  web:
    build: ./frontend
    depends_on:
      api: { condition: service_healthy }
    ports: ["8080:8080"]

  # Optional: `docker compose --profile demo run --rm seed`
  seed:
    build: ./backend
    profiles: ["demo"]
    command: ["python", "-m", "app.seed", "--verifications", "400"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
