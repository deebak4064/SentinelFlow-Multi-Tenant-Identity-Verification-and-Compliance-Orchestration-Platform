name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SF_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinelflow_test
  SF_REDIS_URL: redis://localhost:6379/1

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sentinel, POSTGRES_PASSWORD: sentinel, POSTGRES_DB: sentinelflow_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests --select E,F,W,I,B,UP --ignore E501,E701,B008
      - name: Tests (includes migration drift check, tenant isolation and security suites)
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: backend/coverage.xml }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sentinel, POSTGRES_PASSWORD: sentinel, POSTGRES_DB: sentinelflow }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SF_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinelflow
      SF_REDIS_URL: redis://localhost:6379/0
      SF_LOGIN_RATE_LIMIT_PER_MINUTE: "200"
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start API with seeded demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed --verifications 120
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          npx wait-on -t 60000 http://localhost:4173 http://localhost:8000/health/ready
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report }

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: |
          cp .env.example .env
          sed -i "s/change-me-to-a-long-random-string/$(openssl rand -hex 24)/" .env
          sed -i "s|^SF_FIELD_ENCRYPTION_KEY=.*|SF_FIELD_ENCRYPTION_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')|" .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health/ready && break; sleep 3; done
          docker compose --profile demo run --rm seed
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/health/ready
          curl -fsS http://localhost:8080/ | grep -q "<div id=\"root\">"
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/v1/auth/token -H 'content-type: application/json' \
            -d '{"email":"org.admin@northwind.example","password":"SentinelDemo2026!"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS -X POST http://localhost:8080/api/v1/verifications -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"external_ref":"ci-smoke","verification_type":"individual","subject":{"full_name":"Ci Smoke","dob":"1990-01-01","country":"GB","document_type":"passport","document_number":"P12345678"}}' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["status"]=="completed",d;print("decision:",d["decision"])'
          curl -fsS -X POST http://localhost:8080/api/v1/verifications -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"external_ref":"ci-queue","verification_type":"individual","execution_mode":"queue","subject":{"full_name":"Queue Smoke","dob":"1990-01-01","country":"GB","document_type":"passport","document_number":"P12345678"}}' \
            -o /tmp/q.json -w "%{http_code}\n" | grep -q 202
          sleep 3
          ID=$(python3 -c 'import json;print(json.load(open("/tmp/q.json"))["id"])')
          curl -fsS http://localhost:8080/api/v1/verifications/$ID -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["status"]=="completed",d["status"];print("worker processed queued request")'
      - if: always()
        run: docker compose logs --no-color | tail -200
